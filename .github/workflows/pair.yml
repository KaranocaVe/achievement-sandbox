name: Create paired shadow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: achievement/pair

      - name: Commit the shadow with its co-author
        shell: bash
        run: |
          printf '%s\n' 'The shadow is sufficient.' > shadow.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shadow.txt
          git commit -m 'Add a shadow' -m 'Co-authored-by: KaranocaVe <39995482+KaranocaVe@users.noreply.github.com>'
          git push origin HEAD:achievement/pair
