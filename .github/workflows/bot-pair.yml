name: Open bot-authored paired PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  open-paired-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Create bot-authored PR with mapped co-author
        shell: bash
        run: |
          git switch -c agent/pair-extraordinaire-bot
          printf '%s\n' 'The second shadow has two names.' > paired-shadow.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paired-shadow.txt
          git commit -m 'Add the paired shadow' -m 'Co-authored-by: KaranocaVe <39995482+KaranocaVe@users.noreply.github.com>'
          git push -u origin agent/pair-extraordinaire-bot
          printf '%s\n' \
            '## What changed' \
            '' \
            '- Added a second shadow in a bot-authored commit.' \
            '- Recorded `KaranocaVe` as a mapped co-author.' \
            '' \
            '## Why' \
            '' \
            'This is a transparent GitHub achievement experiment.' \
            '' \
            '## Validation' \
            '' \
            '- Created and attributed entirely by this repository workflow.' \
            > "$RUNNER_TEMP/pr-body.md"
          gh pr create \
            --base main \
            --head agent/pair-extraordinaire-bot \
            --title 'Add the bot-authored paired shadow' \
            --body-file "$RUNNER_TEMP/pr-body.md"
