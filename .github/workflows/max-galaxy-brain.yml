name: Max Galaxy Brain

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Create questions or accept answers
        required: true
        type: choice
        options:
          - create
          - accept
      count:
        description: Number of questions to create
        required: false
        default: "24"
        type: string
      comment_ids:
        description: Space-separated discussion comment node IDs
        required: false
        type: string

permissions:
  contents: read
  discussions: write

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode }}
      QUESTION_COUNT: ${{ inputs.count }}
      COMMENT_IDS: ${{ inputs.comment_ids }}
      REPOSITORY_ID: R_kgDOTm1Z0g
      CATEGORY_ID: DIC_kwDOTm1Z0s4DCNuC
    steps:
      - name: Create questions or accept answers
        shell: bash
        run: |
          if [[ "$MODE" == "create" ]]; then
            [[ "$QUESTION_COUNT" =~ ^[0-9]+$ ]]
            (( QUESTION_COUNT >= 1 && QUESTION_COUNT <= 32 ))

            for ((number = 1; number <= QUESTION_COUNT; number++)); do
              gh api graphql \
                -f repositoryId="$REPOSITORY_ID" \
                -f categoryId="$CATEGORY_ID" \
                -f title="Maximum shadow ${GITHUB_RUN_ID}-${number}" \
                -f body='What remains when only the achievement matters?' \
                -f query='mutation($repositoryId:ID!,$categoryId:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repositoryId,categoryId:$categoryId,title:$title,body:$body}){discussion{id number url author{login}}}}'
            done
          elif [[ "$MODE" == "accept" ]]; then
            read -r -a comment_ids <<< "$COMMENT_IDS"
            (( ${#comment_ids[@]} >= 1 ))

            for comment_id in "${comment_ids[@]}"; do
              gh api graphql \
                -f id="$comment_id" \
                -f query='mutation($id:ID!){markDiscussionCommentAsAnswer(input:{id:$id}){discussion{id number url answer{author{login}}}}}'
            done
          else
            printf 'Unsupported mode: %s\n' "$MODE" >&2
            exit 1
          fi
